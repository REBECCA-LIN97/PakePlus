<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>智能备忘录系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;
        }
        
        body {
            background: var(--bg-primary);
            padding: 20px;
            transition: all 0.3s ease;
            min-height: 100vh;
        }
        
        /* 10种莫兰迪色系主题 */
        .theme-1 { --bg-primary: #F3F0E9; --bg-secondary: #E8E4DB; --accent-primary: #9CAF88; --accent-hover: #8A9D73; --text-dark: #4A4A4A; --border-color: #D1CCC4; --card-white: #FCFAF5; }
        .theme-2 { --bg-primary: #E8EDF2; --bg-secondary: #DCE3E9; --accent-primary: #7D8C7F; --accent-hover: #6B7A6D; --text-dark: #4A5A6A; --border-color: #C8D0D8; --card-white: #F5F7FA; }
        .theme-3 { --bg-primary: #E8EFE5; --bg-secondary: #DCE6D3; --accent-primary: #8BA384; --accent-hover: #799172; --text-dark: #3A5A3A; --border-color: #C8D8C0; --card-white: #F4F8F0; }
        .theme-4 { --bg-primary: #F5EDEF; --bg-secondary: #EDE1E4; --accent-primary: #C9A9B4; --accent-hover: #B897A2; --text-dark: #5A4A4A; --border-color: #D8C8CC; --card-white: #FDF7F8; }
        .theme-5 { --bg-primary: #EBE4E8; --bg-secondary: #DFD5DC; --accent-primary: #B5A0B0; --accent-hover: #A38E9E; --text-dark: #4A3A4A; --border-color: #C8BCC4; --card-white: #F9F5F8; }
        .theme-6 { --bg-primary: #E5E8E3; --bg-secondary: #D9DDD4; --accent-primary: #A0B0A0; --accent-hover: #8E9E8E; --text-dark: #3A4A3A; --border-color: #C0C8BC; --card-white: #F4F6F0; }
        .theme-7 { --bg-primary: #F0EAE3; --bg-secondary: #E4DCD3; --accent-primary: #C4A882; --accent-hover: #B29670; --text-dark: #5A4A3A; --border-color: #D4C8BC; --card-white: #FCF8F2; }
        .theme-8 { --bg-primary: #E3E6EE; --bg-secondary: #D7DAE4; --accent-primary: #8E9EBB; --accent-hover: #7C8CA9; --text-dark: #3A4A5A; --border-color: #BCC4D0; --card-white: #F0F2F8; }
        .theme-9 { --bg-primary: #EDE5DF; --bg-secondary: #E1D7CF; --accent-primary: #B89A8A; --accent-hover: #A68878; --text-dark: #5A4A3A; --border-color: #D0C4BC; --card-white: #FBF6F2; }
        .theme-10 { --bg-primary: #E2E6E0; --bg-secondary: #D4D9D0; --accent-primary: #90A89A; --accent-hover: #7E9688; --text-dark: #3A4A3A; --border-color: #BCC4B8; --card-white: #F0F4EC; }
        
        /* 登录/注册页面 */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 20000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .auth-container {
            background: var(--card-white);
            border-radius: 24px;
            padding: 32px;
            width: 400px;
            max-width: 90%;
            border: 1px solid var(--border-color);
        }
        
        .auth-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-dark);
            text-align: center;
            margin-bottom: 24px;
        }
        
        .auth-input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            background: var(--card-white);
            color: var(--text-dark);
        }
        
        .auth-input:focus { outline: none; border-color: var(--accent-primary); }
        
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
        }
        
        .auth-btn:hover { background: var(--accent-hover); }
        
        .auth-link {
            text-align: center;
            margin-top: 16px;
            color: var(--text-light);
            cursor: pointer;
        }
        
        .auth-link span { color: var(--accent-primary); text-decoration: underline; }
        
        .user-info-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-radius: 40px;
        }
        
        .user-name { color: var(--text-dark); font-weight: 500; }
        
        .logout-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 20px;
            color: var(--text-light);
        }
        
        /* 回收站按钮 */
        .trash-btn {
            position: fixed;
            left: 20px;
            bottom: 20px;
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        
        .trash-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }
        
        .tabs-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 0;
        }
        
        .history-btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        
        .tabs-container {
            background: var(--card-white);
            border-radius: 16px 16px 0 0;
            padding: 12px 20px 0 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }
        
        .tab {
            padding: 10px 20px;
            background: var(--bg-secondary);
            border: none;
            border-radius: 12px 12px 0 0;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-dark);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .tab.active { background: var(--accent-primary); color: white; }
        
        .delete-tab {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 0 5px;
            border-radius: 50%;
        }
        
        .add-tab-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .main-container {
            background: var(--card-white);
            border-radius: 0 0 16px 16px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        
        .memo-content { display: none; }
        .memo-content.active { display: block; }
        
        .table-wrapper {
            overflow-x: auto;
            margin: 16px 0;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        
        th {
            position: relative;
            background-color: var(--bg-secondary);
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .resize-handle-col {
            position: absolute;
            right: 0;
            top: 0;
            width: 8px;
            height: 100%;
            cursor: col-resize;
            background: transparent;
            z-index: 10;
        }
        
        .resize-handle-col:hover {
            background: var(--accent-primary);
            opacity: 0.5;
        }
        
        td {
            position: relative;
        }
        
        .resize-handle-row {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 8px;
            cursor: row-resize;
            background: transparent;
            z-index: 10;
        }
        
        .resize-handle-row:hover {
            background: var(--accent-primary);
            opacity: 0.5;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
            table-layout: auto;
        }
        
        th, td {
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            text-align: left;
            vertical-align: top;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .select-all-col {
            width: 40px;
            text-align: center;
        }
        
        .select-all-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .row-completed { text-decoration: line-through; opacity: 0.6; }
        
        .checkbox-col {
            text-align: center;
            width: 50px;
            vertical-align: middle;
        }
        
        .action-col {
            text-align: center;
            width: 80px;
            vertical-align: middle;
        }
        
        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 6px;
            border-radius: 6px;
            margin: 0 2px;
        }
        
        .btn-icon:hover { background: var(--bg-secondary); }
        
        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 10px;
            background: var(--bg-secondary);
            border-radius: 12px;
        }
        
        button {
            background: var(--accent-primary);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
        
        button:hover { background: var(--accent-hover); }
        button.danger { background: #dc3545; }
        button.success { background: #28a745; }
        
        .remark-section {
            margin-top: 20px;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
        }
        
        .remark-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .remark-toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
        .remark-toolbar button { padding: 4px 12px; font-size: 12px; }
        
        .remark-editor {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            resize: vertical;
            overflow-y: auto;
            background-color: var(--card-white);
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .footer-bar { margin-top: 10px; display: flex; justify-content: space-between; }
        .save-status { font-size: 12px; color: #28a745; }
        
        .theme-section {
            margin-top: 16px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 12px;
        }
        
        .theme-section-title {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 10px;
        }
        
        .theme-circle-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .theme-drawer-panel {
            position: fixed;
            right: -300px;
            top: 0;
            width: 280px;
            height: 100%;
            background: var(--card-white);
            box-shadow: -2px 0 20px rgba(0,0,0,0.15);
            transition: right 0.3s ease;
            z-index: 10001;
            overflow-y: auto;
            border-left: 1px solid var(--border-color);
        }
        
        .theme-drawer-panel.open { right: 0; }
        
        .theme-drawer-header {
            padding: 20px;
            background: var(--accent-primary);
            color: white;
            font-weight: 600;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .theme-drawer-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        
        .theme-drawer-list { padding: 16px; }
        
        .theme-drawer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            background: var(--bg-secondary);
        }
        
        .theme-drawer-item.active { background: var(--accent-primary); color: white; }
        
        .theme-drawer-color {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid white;
        }
        
        .color-picker-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        
        .color-picker-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            max-width: 500px;
            width: 90%;
        }
        
        .color-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .color-option {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .color-option:hover { transform: scale(1.1); border-color: #333; }
        
        .custom-color { margin-top: 15px; display: flex; gap: 10px; align-items: center; }
        .custom-color input { flex: 1; padding: 8px; border: 1px solid #dee2e6; border-radius: 6px; }
        .color-preview { width: 40px; height: 40px; border-radius: 6px; border: 1px solid #dee2e6; }
        
        .color-picker-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        
        .import-area { position: relative; display: inline-block; }
        .import-area input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        
        .small-btn { padding: 4px 12px; font-size: 12px; background: var(--accent-primary); }
        
        .small-window-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent-primary);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            z-index: 998;
        }
        
        .column-selector-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10002;
            justify-content: center;
            align-items: center;
        }
        
        .column-selector-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            max-width: 400px;
            width: 90%;
        }
        
        .column-list { max-height: 300px; overflow-y: auto; margin-bottom: 20px; }
        
        .column-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .column-item input { margin-right: 10px; width: 18px; height: 18px; cursor: pointer; }
        .column-item label { cursor: pointer; flex: 1; }
        
        .selector-buttons { display: flex; gap: 10px; justify-content: flex-end; }
        
        /* 回收站弹窗 */
        .trash-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 20002;
            justify-content: center;
            align-items: center;
        }
        
        .trash-modal-content {
            background: var(--card-white);
            border-radius: 20px;
            width: 80%;
            max-width: 700px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .trash-modal-header {
            padding: 20px;
            background: var(--accent-primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .trash-modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .trash-item {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .trash-item-info { flex: 1; }
        .trash-item-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        .trash-item-date { font-size: 12px; color: var(--text-light); }
        .trash-item-actions { display: flex; gap: 10px; }
        .restore-btn { background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .permanent-delete-btn { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        
        /* 历史弹窗 */
        .history-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 20001;
            justify-content: center;
            align-items: center;
        }
        
        .history-modal-content {
            background: var(--card-white);
            border-radius: 20px;
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .history-modal-header {
            padding: 20px;
            background: var(--accent-primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .history-modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .history-item {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            border-left: 4px solid var(--accent-primary);
        }
        
        .history-item-title { font-weight: 600; font-size: 16px; margin-bottom: 8px; }
        .history-item-date { font-size: 12px; color: var(--text-light); }
        
        .history-detail-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .history-detail-table th, .history-detail-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
        }
        
        .empty-tip { text-align: center; padding: 40px; color: var(--text-light); }
        
        /* 独立小窗口样式 */
        .floating-window {
            position: fixed;
            width: auto;
            min-width: 400px;
            max-width: 90vw;
            background: var(--card-white);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        
        .floating-header {
            background: var(--accent-primary);
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            flex-shrink: 0;
        }
        
        .floating-title { font-size: 14px; font-weight: 500; }
        
        .floating-controls button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 8px;
            font-size: 12px;
        }
        
        .floating-content { 
            flex: 1; 
            overflow-y: auto; 
            overflow-x: auto;
            padding: 16px; 
            max-height: 60vh;
            background: var(--bg-primary);
        }
        
        .floating-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: var(--card-white);
            border-radius: 8px;
            margin-bottom: 15px;
            table-layout: auto;
        }
        
        .floating-table th, .floating-table td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
            vertical-align: top;
        }
        
        .floating-table th {
            background: var(--bg-secondary);
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .floating-checkbox {
            text-align: center;
            width: 50px;
        }
        
        .floating-checkbox input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        .floating-remark-section {
            margin-top: 12px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 10px;
        }
        
        .floating-remark-title {
            font-weight: 600;
            font-size: 12px;
            color: var(--text-dark);
            margin-bottom: 5px;
        }
        
        .floating-remark-editor {
            width: 100%;
            min-height: 70px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 12px;
            resize: vertical;
            background: var(--card-white);
        }
        
        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 15px;
            height: 15px;
            cursor: nw-resize;
            background: linear-gradient(135deg, transparent 50%, var(--accent-primary) 50%);
            border-radius: 0 0 8px 0;
        }
        
        .resizing-col { user-select: none; }
        .resizing-row { user-select: none; }
    </style>
</head>
<body class="theme-1">
<div id="app">
    <div id="userInfoBar" class="user-info-bar" style="display: none;">
        <span class="user-name" id="userNameDisplay"></span>
        <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>
    
    <div class="tabs-wrapper">
        <div class="tabs-container" id="tabsContainer" style="display: none;"></div>
        <button class="history-btn" id="rightHistoryBtn" style="display: none;">历史</button>
    </div>

<script>
    // 主题配置
    const themes = [
        { id: 1, name: '雾里看花', color1: '#F3F0E9', color2: '#9CAF88' },
        { id: 2, name: '烟雨江南', color1: '#E8EDF2', color2: '#7D8C7F' },
        { id: 3, name: '青山远黛', color1: '#E8EFE5', color2: '#8BA384' },
        { id: 4, name: '落樱缤纷', color1: '#F5EDEF', color2: '#C9A9B4' },
        { id: 5, name: '紫藤花语', color1: '#EBE4E8', color2: '#B5A0B0' },
        { id: 6, name: '晨雾松林', color1: '#E5E8E3', color2: '#A0B0A0' },
        { id: 7, name: '秋日私语', color1: '#F0EAE3', color2: '#C4A882' },
        { id: 8, name: '月夜星空', color1: '#E3E6EE', color2: '#8E9EBB' },
        { id: 9, name: '暖阳午后', color1: '#EDE5DF', color2: '#B89A8A' },
        { id: 10, name: '清泉石上', color1: '#E2E6E0', color2: '#90A89A' }
    ];
    
    let currentThemeId = 1;
    let currentUser = null;
    let memos = {};
    let currentMemoId = null;
    let nextId = 1;
    let pendingColorCallback = null;
    let selectedColumns = [];
    let historyRecords = [];
    let trashBin = [];
    let columnWidths = {};
    let rowHeights = {};
    
    const presetColors = ['#000000', '#333333', '#666666', '#999999', '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#98D8C8', '#F7B731', '#FF9F4A', '#A8E6CF', '#FFD3B6', '#FF8B94', '#0066ff', '#28a745', '#dc3545', '#fd7e14'];
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function stripHtml(html) {
        if (!html) return '';
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || '';
    }
    
    function getTodayString() {
        const today = new Date();
        return `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    }
    
    function initDefaultMemo() {
        return {
            id: 'memo_1',
            name: '我的备忘录',
            headers: ['任务名称', '优先级', '截止日期'],
            rows: [
                { cells: ['撰写周报', '高', getTodayString()], completed: false, bgColor: '#ffffff' },
                { cells: ['整理文档', '中', getTodayString()], completed: false, bgColor: '#ffffff' },
                { cells: ['团队会议', '高', getTodayString()], completed: false, bgColor: '#ffffff' }
            ],
            remark: ''
        };
    }
    
    function changeTheme(themeId) {
        currentThemeId = themeId;
        document.body.className = 'theme-' + themeId;
        if (currentUser) localStorage.setItem('user_' + currentUser.id + '_theme', themeId);
        document.querySelectorAll('.theme-drawer-item').forEach(function(item) {
            if (parseInt(item.dataset.id) === themeId) item.classList.add('active');
            else item.classList.remove('active');
        });
        closeThemeDrawer();
    }
    
    function initThemeDrawer() {
        var container = document.getElementById('themeDrawerList');
        container.innerHTML = '';
        themes.forEach(function(theme) {
            var item = document.createElement('div');
            item.className = 'theme-drawer-item';
            item.dataset.id = theme.id;
            if (theme.id === currentThemeId) item.classList.add('active');
            item.onclick = function() { changeTheme(theme.id); };
            item.innerHTML = '<div class="theme-drawer-color" style="background: linear-gradient(135deg, ' + theme.color1 + ', ' + theme.color2 + ');"></div><div class="theme-drawer-name">' + theme.name + '</div>';
            container.appendChild(item);
        });
    }
    
    function openThemeDrawer() { document.getElementById('themeDrawerPanel').classList.add('open'); }
    function closeThemeDrawer() { document.getElementById('themeDrawerPanel').classList.remove('open'); }
    
    function selectAllTasks(memoId, isChecked) {
        var memo = memos[memoId];
        if (!memo) return;
        for (var i = 0; i < memo.rows.length; i++) memo.rows[i].completed = isChecked;
        saveToLocal();
        if (isChecked) {
            var historyItem = {
                id: Date.now(),
                memoId: memoId,
                memoName: memo.name,
                memoData: JSON.parse(JSON.stringify(memo)),
                completedDate: new Date().toLocaleString()
            };
            historyRecords.push(historyItem);
            saveHistory();
            var newId = 'memo_' + nextId++;
            memos[newId] = {
                id: newId,
                name: '备忘录 ' + (nextId-1),
                headers: memo.headers.slice(),
                rows: [{ cells: new Array(memo.headers.length).fill('新任务'), completed: false, bgColor: '#ffffff' }],
                remark: ''
            };
            delete memos[memoId];
            currentMemoId = newId;
            render();
            alert('所有任务已完成，已移至历史记录！');
        } else {
            saveToLocal();
            render();
        }
    }
    
    function loadHistory() {
        var saved = localStorage.getItem('user_' + (currentUser ? currentUser.id : '') + '_history');
        if (saved) historyRecords = JSON.parse(saved);
        else historyRecords = [];
    }
    
    function saveHistory() {
        if (currentUser) localStorage.setItem('user_' + currentUser.id + '_history', JSON.stringify(historyRecords));
    }
    
    function showHistory() {
        if (historyRecords.length === 0) { alert('暂无历史记录'); return; }
        var modal = document.getElementById('historyModal');
        var body = document.getElementById('historyModalBody');
        document.getElementById('historyModalTitle').innerText = '历史记录';
        var html = '';
        for (var i = 0; i < historyRecords.length; i++) {
            var record = historyRecords[i];
            var preview = (record.memoData.rows[0] ? record.memoData.rows[0].cells[0] : '') || '';
            html += '<div class="history-item" onclick="viewHistoryDetail(\'' + record.id + '\')"><div class="history-item-title">\uD83D\uDCCB ' + escapeHtml(record.memoName) + '</div><div class="history-item-date">完成时间：' + record.completedDate + '</div><div class="history-item-preview">预览：' + escapeHtml(preview) + '...</div></div>';
        }
        body.innerHTML = html;
        modal.style.display = 'flex';
    }
    
    function viewHistoryDetail(recordId) {
        var record = historyRecords.find(function(r) { return r.id == recordId; });
        if (!record) return;
        document.getElementById('historyModalTitle').innerText = '\uD83D\uDCCB ' + escapeHtml(record.memoName) + ' (历史记录)';
        var tableHtml = '<table class="history-detail-table"><thead><tr>';
        for (var i = 0; i < record.memoData.headers.length; i++) {
            tableHtml += '<th>' + escapeHtml(record.memoData.headers[i]) + '</th>';
        }
        tableHtml += '<th>状态</th></tr></thead><tbody>';
        for (var r = 0; r < record.memoData.rows.length; r++) {
            var row = record.memoData.rows[r];
            tableHtml += '<tr>';
            for (var c = 0; c < row.cells.length; c++) {
                tableHtml += '<td>' + escapeHtml(row.cells[c]) + '</td>';
            }
            tableHtml += '<td>' + (row.completed ? '已完成' : '未完成') + '</td></tr>';
        }
        tableHtml += '</tbody></table>';
        var remarkHtml = '<div style="margin-top:15px;"><strong>\uD83D\uDCDD 备注：</strong><div style="margin-top:5px;padding:10px;background:var(--bg-secondary);border-radius:8px;">' + (record.memoData.remark || '无') + '</div></div>';
        var restoreBtn = '<button onclick="restoreFromHistory(\'' + recordId + '\')" style="margin-top:15px;background:#28a745;">恢复到当前备忘录</button>';
        document.getElementById('historyModalBody').innerHTML = tableHtml + remarkHtml + restoreBtn;
    }
    
    function restoreFromHistory(recordId) {
        var record = historyRecords.find(function(r) { return r.id == recordId; });
        if (!record) return;
        if (confirm('确定要将「' + record.memoName + '」恢复到当前备忘录吗？')) {
            var newId = 'memo_' + nextId++;
            memos[newId] = JSON.parse(JSON.stringify(record.memoData));
            memos[newId].id = newId;
            memos[newId].name = record.memoName;
            memos[newId].rows.forEach(function(row) { row.completed = false; });
            currentMemoId = newId;
            saveToLocal();
            render();
            closeHistoryModal();
            alert('恢复成功！');
        }
    }
    
    function closeHistoryModal() { document.getElementById('historyModal').style.display = 'none'; }
    
    function loadTrash() {
        var saved = localStorage.getItem('user_' + (currentUser ? currentUser.id : '') + '_trash');
        if (saved) trashBin = JSON.parse(saved);
        else trashBin = [];
    }
    
    function saveTrash() {
        if (currentUser) localStorage.setItem('user_' + currentUser.id + '_trash', JSON.stringify(trashBin));
    }
    
    function deleteMemoToTrash(memoId) {
        var memo = memos[memoId];
        if (!memo) return;
        var trashItem = { id: Date.now(), memoId: memoId, memoName: memo.name, memoData: JSON.parse(JSON.stringify(memo)), deletedDate: new Date().toLocaleString() };
        trashBin.push(trashItem);
        saveTrash();
        delete memos[memoId];
        if (currentMemoId === memoId) {
            var remainingIds = Object.keys(memos);
            currentMemoId = remainingIds.length > 0 ? remainingIds[0] : null;
        }
        if (Object.keys(memos).length === 0) {
            var newId = 'memo_' + nextId++;
            memos[newId] = { id: newId, name: '我的备忘录', headers: ['任务名称', '优先级', '截止日期'], rows: [{ cells: ['示例任务', '高', getTodayString()], completed: false, bgColor: '#ffffff' }], remark: '' };
            currentMemoId = newId;
        }
        saveToLocal();
        render();
        alert('备忘录「' + escapeHtml(memo.name) + '」已移至回收站');
    }
    
    function showTrash() {
        if (trashBin.length === 0) { alert('回收站为空'); return; }
        var modal = document.getElementById('trashModal');
        var body = document.getElementById('trashModalBody');
        var html = '';
        for (var i = 0; i < trashBin.length; i++) {
            var item = trashBin[i];
            html += '<div class="trash-item"><div class="trash-item-info"><div class="trash-item-title">\uD83D\uDCCB ' + escapeHtml(item.memoName) + '</div><div class="trash-item-date">删除时间：' + item.deletedDate + '</div></div><div class="trash-item-actions"><button class="restore-btn" onclick="restoreFromTrash(\'' + item.id + '\')">恢复</button><button class="permanent-delete-btn" onclick="permanentDelete(\'' + item.id + '\')">永久删除</button></div></div>';
        }
        body.innerHTML = html;
        modal.style.display = 'flex';
    }
    
    function closeTrashModal() { document.getElementById('trashModal').style.display = 'none'; }
    
    function restoreFromTrash(itemId) {
        var item = trashBin.find(function(i) { return i.id == itemId; });
        if (!item) return;
        var newId = 'memo_' + nextId++;
        memos[newId] = JSON.parse(JSON.stringify(item.memoData));
        memos[newId].id = newId;
        memos[newId].name = item.memoName;
        currentMemoId = newId;
        trashBin = trashBin.filter(function(i) { return i.id != itemId; });
        saveTrash();
        saveToLocal();
        render();
        closeTrashModal();
        alert('已恢复备忘录「' + escapeHtml(item.memoName) + '」');
    }
    
    function permanentDelete(itemId) {
        if (confirm('确定永久删除这个备忘录吗？此操作不可恢复！')) {
            trashBin = trashBin.filter(function(i) { return i.id != itemId; });
            saveTrash();
            showTrash();
        }
    }
    
    function initResizeHandlers(table, memoId) {
        var cols = table.querySelectorAll('th');
        cols.forEach(function(col, colIdx) {
            var handle = document.createElement('div');
            handle.className = 'resize-handle-col';
            col.style.position = 'relative';
            col.appendChild(handle);
            var startX, startWidth;
            handle.addEventListener('mousedown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                startX = e.clientX;
                startWidth = col.offsetWidth;
                document.addEventListener('mousemove', onColMove);
                document.addEventListener('mouseup', onColUp);
                document.body.classList.add('resizing-col');
            });
            function onColMove(e) {
                var newWidth = startWidth + (e.clientX - startX);
                if (newWidth > 40) col.style.width = newWidth + 'px';
            }
            function onColUp() {
                document.removeEventListener('mousemove', onColMove);
                document.removeEventListener('mouseup', onColUp);
                document.body.classList.remove('resizing-col');
                if (!columnWidths[memoId]) columnWidths[memoId] = {};
                columnWidths[memoId][colIdx] = col.offsetWidth;
                saveToLocal();
            }
        });
        
        var rows = table.querySelectorAll('tbody tr');
        rows.forEach(function(row, rowIdx) {
            var handle = document.createElement('div');
            handle.className = 'resize-handle-row';
            row.style.position = 'relative';
            row.appendChild(handle);
            var startY, startHeight;
            handle.addEventListener('mousedown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                startY = e.clientY;
                startHeight = row.offsetHeight;
                document.addEventListener('mousemove', onRowMove);
                document.addEventListener('mouseup', onRowUp);
                document.body.classList.add('resizing-row');
            });
            function onRowMove(e) {
                var newHeight = startHeight + (e.clientY - startY);
                if (newHeight > 30) row.style.height = newHeight + 'px';
            }
            function onRowUp() {
                document.removeEventListener('mousemove', onRowMove);
                document.removeEventListener('mouseup', onRowUp);
                document.body.classList.remove('resizing-row');
                if (!rowHeights[memoId]) rowHeights[memoId] = {};
                rowHeights[memoId][rowIdx] = row.offsetHeight;
                saveToLocal();
            }
        });
    }
    
    function setupShiftEnter(editor, memoId, rowIdx, colIdx) {
        if (!editor) return;
        editor.removeEventListener('keydown', shiftEnterHandler);
        editor.addEventListener('keydown', shiftEnterHandler);
        function shiftEnterHandler(e) {
            if (e.key === 'Enter' && e.shiftKey) {
                e.preventDefault();
                var selection = window.getSelection();
                var range = selection.getRangeAt(0);
                var br = document.createElement('br');
                range.deleteContents();
                range.insertNode(br);
                range.setStartAfter(br);
                range.setEndAfter(br);
                selection.removeAllRanges();
                selection.addRange(range);
                setTimeout(function() {
                    memos[memoId].rows[rowIdx].cells[colIdx] = editor.innerText;
                    saveToLocal();
                }, 10);
            }
        }
    }
    
    function loadUsers() { return JSON.parse(localStorage.getItem('memo_users') || '{}'); }
    function saveUsers(users) { localStorage.setItem('memo_users', JSON.stringify(users)); }
    
    function register(id, password, question, answer) {
        var users = loadUsers();
        if (users[id]) { alert('ID 已注册'); return false; }
        users[id] = { password: password, securityQuestion: question, securityAnswer: answer };
        saveUsers(users);
        return true;
    }
    
    function login(id, password) {
        var users = loadUsers();
        if (!users[id]) { alert('账号不存在'); return false; }
        if (users[id].password !== password) { alert('密码错误'); return false; }
        currentUser = { id: id };
        localStorage.setItem('current_user', id);
        var savedData = localStorage.getItem('user_' + id + '_memos');
        if (savedData) memos = JSON.parse(savedData);
        else { var defaultMemo = initDefaultMemo(); memos = {}; memos[defaultMemo.id] = defaultMemo; }
        
        var savedWidths = localStorage.getItem('user_' + id + '_colWidths');
        if (savedWidths) columnWidths = JSON.parse(savedWidths);
        var savedHeights = localStorage.getItem('user_' + id + '_rowHeights');
        if (savedHeights) rowHeights = JSON.parse(savedHeights);
        
        var maxId = 0;
        for (var key in memos) {
            var num = parseInt(key.split('_')[1]) || 0;
            if (num > maxId) maxId = num;
        }
        nextId = maxId + 1;
        currentMemoId = Object.keys(memos)[0];
        var savedTheme = localStorage.getItem('user_' + id + '_theme');
        if (savedTheme) changeTheme(parseInt(savedTheme));
        else changeTheme(1);
        loadHistory();
        loadTrash();
        render();
        
        document.getElementById('userInfoBar').style.display = 'flex';
        document.getElementById('tabsContainer').style.display = 'flex';
        document.getElementById('mainContainer').style.display = 'block';
        document.getElementById('smallWindowBtn').style.display = 'block';
        document.getElementById('trashBtn').style.display = 'flex';
        document.getElementById('rightHistoryBtn').style.display = 'block';
        document.getElementById('userNameDisplay').innerText = id;
        return true;
    }
    
    function logout() {
        currentUser = null;
        localStorage.removeItem('current_user');
        document.getElementById('userInfoBar').style.display = 'none';
        document.getElementById('tabsContainer').style.display = 'none';
        document.getElementById('mainContainer').style.display = 'none';
        document.getElementById('smallWindowBtn').style.display = 'none';
        document.getElementById('trashBtn').style.display = 'none';
        document.getElementById('rightHistoryBtn').style.display = 'none';
        showAuthPage();
    }
    
    function saveUserData() { 
        if (currentUser) {
            localStorage.setItem('user_' + currentUser.id + '_memos', JSON.stringify(memos));
            localStorage.setItem('user_' + currentUser.id + '_colWidths', JSON.stringify(columnWidths));
            localStorage.setItem('user_' + currentUser.id + '_rowHeights', JSON.stringify(rowHeights));
        }
    }
    function saveToLocal() { saveUserData(); saveHistory(); saveTrash(); }
    
    function render() {
        renderTabs();
        renderMemos();
    }
    
    function renderTabs() {
        var container = document.getElementById('tabsContainer');
        container.innerHTML = '';
        for (var key in memos) {
            var memo = memos[key];
            var tab = document.createElement('button');
            tab.className = 'tab ' + (currentMemoId === memo.id ? 'active' : '');
            tab.innerHTML = escapeHtml(memo.name) + (Object.keys(memos).length > 1 ? '<button class="delete-tab" data-id="' + memo.id + '">x</button>' : '');
            tab.onclick = (function(memId) {
                return function(e) { if (!e.target.classList.contains('delete-tab')) switchMemo(memId); };
            })(memo.id);
            container.appendChild(tab);
        }
        var addBtn = document.createElement('button');
        addBtn.className = 'add-tab-btn';
        addBtn.innerHTML = '+ 新建备忘录';
        addBtn.onclick = addNewMemo;
        container.appendChild(addBtn);
        var delBtns = document.querySelectorAll('.delete-tab');
        delBtns.forEach(function(btn) {
            btn.onclick = function(e) { e.stopPropagation(); deleteMemoToTrash(btn.dataset.id); };
        });
    }
    
    function renderMemos() {
        var container = document.getElementById('mainContainer');
        container.innerHTML = '';
        for (var key in memos) {
            var memo = memos[key];
            var div = document.createElement('div');
            div.className = 'memo-content ' + (currentMemoId === memo.id ? 'active' : '');
            div.id = 'memo-' + memo.id;
            div.innerHTML = generateMemoHTML(memo);
            container.appendChild(div);
            
            var cells = div.querySelectorAll('td div[contenteditable="true"]');
            cells.forEach(function(cell) {
                var td = cell.closest('td');
                var tr = td.closest('tr');
                var rowIdx = Array.from(tr.parentNode.children).indexOf(tr);
                var colIdx = Array.from(tr.children).indexOf(td);
                setupShiftEnter(cell, memo.id, rowIdx, colIdx);
            });
        }
        
        setTimeout(function() {
            var activeMemo = document.querySelector('.memo-content.active');
            if (activeMemo) {
                var id = activeMemo.id.replace('memo-', '');
                var table = document.querySelector('#table-' + id);
                if (table) initResizeHandlers(table, id);
                if (columnWidths[id]) {
                    var cols = table.querySelectorAll('th');
                    for (var i = 0; i < cols.length; i++) {
                        if (columnWidths[id][i]) cols[i].style.width = columnWidths[id][i] + 'px';
                    }
                }
                if (rowHeights[id]) {
                    var rows = table.querySelectorAll('tbody tr');
                    for (var j = 0; j < rows.length; j++) {
                        if (rowHeights[id][j]) rows[j].style.height = rowHeights[id][j] + 'px';
                    }
                }
            }
        }, 50);
    }
    
    function generateMemoHTML(memo) {
        var headersHtml = '<th class="select-all-col"><input type="checkbox" class="select-all-checkbox" onchange="selectAllTasks(\'' + memo.id + '\', this.checked)"></th>';
        for (var i = 0; i < memo.headers.length; i++) {

    function switchMemo(id) { currentMemoId = id; render(); }
    function addNewMemo() { var newId = 'memo_' + nextId++; memos[newId] = { id: newId, name: '备忘录 ' + (nextId-1), headers: ['任务', '状态'], rows: [{ cells: ['示例任务', '进行中'], completed: false, bgColor: '#ffffff' }], remark: '' }; currentMemoId = newId; saveToLocal(); render(); }
    function updateMemoName(id, newName) { if (memos[id]) { memos[id].name = newName; saveToLocal(); renderTabs(); } }
    function addRow(id) { var memo = memos[id]; memo.rows.push({ cells: new Array(memo.headers.length).fill('新任务'), completed: false, bgColor: '#ffffff' }); saveToLocal(); renderMemos(); }

    function addColumn(id) { var memo = memos[id]; memo.headers.push('新列 ' + (memo.headers.length + 1)); memo.rows.forEach(function(row) { row.cells.push('新内容'); }); saveToLocal(); renderMemos(); }
    function deleteColumn(id, colIdx) { if (memos[id].headers.length <= 1) { alert('至少保留一列'); return; } if (confirm('确定删除这一列吗？')) { memos[id].headers.splice(colIdx, 1); memos[id].rows.forEach(function(row) { row.cells.splice(colIdx, 1); }); saveToLocal(); renderMemos(); } }
    function updateHeader(id, colIdx, newValue) { memos[id].headers[colIdx] = newValue; saveToLocal(); }
    function updateCell(id, rowIdx, colIdx, newValue) { memos[id].rows[rowIdx].cells[colIdx] = newValue; saveToLocal(); }
    function toggleComplete(id, rowIdx, isChecked) { memos[id].rows[rowIdx].completed = isChecked; saveToLocal(); renderMemos(); }
    function showRowColorPicker(id, rowIdx) { var color = prompt('输入行背景色(如 #ffcccc 或 lightblue):', memos[id].rows[rowIdx].bgColor || '#ffffff'); if (color) { memos[id].rows[rowIdx].bgColor = color; saveToLocal(); renderMemos(); } }
    
    function getActiveRemarkEditor() {

            var id = activeMemo.id.replace('memo-', '');
            var editor = document.getElementById('remark-editor-' + id);
            return { editor: editor, id: id };
        }
        return { editor: null, id: null };
    }
    
    function formatRemarkBold() { var obj = getActiveRemarkEditor(); if (obj.editor) { document.execCommand('bold', false, null); saveCurrentRemark(); } }
    function formatRemarkItalic() { var obj = getActiveRemarkEditor(); if (obj.editor) { document.execCommand('italic', false, null); saveCurrentRemark(); } }
    function formatRemarkUnderline() { var obj = getActiveRemarkEditor(); if (obj.editor) { document.execCommand('underline', false, null); saveCurrentRemark(); } }
    
    function changeSelectedTextColor() {
        var obj = getActiveRemarkEditor();
        if (!obj.editor) { alert('请先点击备注栏'); return; }
        obj.editor.focus();
        var selection = window.getSelection();
        if (!selection || selection.isCollapsed || selection.rangeCount === 0) { alert('请先选中要改变颜色的文字'); return; }
        showColorPicker('选择文字颜色', '#000000', function(color) {
            obj.editor.focus();
            document.execCommand('styleWithCSS', true, true);
            document.execCommand('foreColor', false, color);
            saveCurrentRemark();
        });
    }
    
    function saveCurrentRemark() {
        var obj = getActiveRemarkEditor();
        if (obj.editor && memos[obj.id]) { memos[obj.id].remark = obj.editor.innerHTML; saveToLocal(); }

            renderMemos();

    function updateRemarkFromFloating(memoId, remarkHtml) {

    // 认证页面
    function showAuthPage() {
        var authHtml = '<div id="authContainer" class="auth-overlay"><div id="loginPage" class="auth-container"><div class="auth-title">智能备忘录</div><input type="text" id="loginId" class="auth-input" placeholder="ID"><input type="password" id="loginPassword" class="auth-input" placeholder="密码"><button class="auth-btn" onclick="handleLogin()">登录</button><div class="auth-link" onclick="showRegisterPage()">还没有账号？<span>注册新账号</span></div><div class="auth-link" onclick="showForgotPage()"><span>忘记密码？</span></div></div></div>';
        var oldAuth = document.getElementById('authContainer');
        if (oldAuth) oldAuth.remove();
        document.getElementById('app').insertAdjacentHTML('afterbegin', authHtml);
    }
    
    function showRegisterPage() {
        var container = document.getElementById('authContainer');
        container.innerHTML = '<div class="auth-container"><div class="auth-title">注册新账号</div><input type="text" id="regId" class="auth-input" placeholder="ID"><input type="password" id="regPassword" class="auth-input" placeholder="密码"><input type="text" id="regQuestion" class="auth-input" placeholder="密保问题"><input type="text" id="regAnswer" class="auth-input" placeholder="密保答案"><button class="auth-btn" onclick="handleRegister()">注册</button><div class="auth-link" onclick="showAuthPage()"><span>返回登录</span></div></div>';
    }
    
    function showForgotPage() {
        var container = document.getElementById('authContainer');
        container.innerHTML = '<div class="auth-container"><div class="auth-title">找回密码</div><input type="text" id="forgotId" class="auth-input" placeholder="ID"><button class="auth-btn" onclick="checkSecurityQuestion()">下一步</button><div class="auth-link" onclick="showAuthPage()"><span>返回登录</span></div></div>';
    }
    
    function checkSecurityQuestion() {
        var id = document.getElementById('forgotId').value.trim();
        if (!id) { alert('请输入ID'); return; }
        var users = loadUsers();
        if (!users[id]) { alert('账号不存在'); return; }
        var container = document.getElementById('authContainer');
        container.innerHTML = '<div class="auth-container"><div class="auth-title">验证密保</div><div style="margin-bottom:16px;padding:12px;background:var(--bg-secondary);border-radius:8px;">密保问题：' + users[id].securityQuestion + '</div><input type="text" id="securityAnswer" class="auth-input" placeholder="密保答案"><input type="password" id="newPassword" class="auth-input" placeholder="新密码"><button class="auth-btn" onclick="handleReset(\'' + id + '\')">重置密码</button><div class="auth-link" onclick="showAuthPage()"><span>返回登录</span></div></div>';
    }
    
    function handleReset(id) {
        var answer = document.getElementById('securityAnswer').value.trim();
        var newPassword = document.getElementById('newPassword').value;
        if (!answer || !newPassword) { alert('请填写完整信息'); return; }
        var users = loadUsers();
        if (users[id] && users[id].securityAnswer === answer) {
            users[id].password = newPassword;
            saveUsers(users);
            alert('密码重置成功！请登录');
            showAuthPage();
        } else { alert('密保答案错误'); }
    }
    
    function handleRegister() {
        var id = document.getElementById('regId').value.trim();
        var password = document.getElementById('regPassword').value;
        var question = document.getElementById('regQuestion').value.trim();
        var answer = document.getElementById('regAnswer').value.trim();
        if (!id || !password || !question || !answer) { alert('请填写完整信息'); return; }
        if (register(id, password, question, answer)) { alert('注册成功！请登录'); showAuthPage(); }
        else { alert('ID 已注册，请重新输入'); showRegisterPage(); }
    }
    
    function handleLogin() {
        var id = document.getElementById('loginId').value.trim();
        var password = document.getElementById('loginPassword').value;
        if (!id || !password) { alert('请输入ID和密码'); return; }
        if (login(id, password)) { var authContainer = document.getElementById('authContainer'); if (authContainer) authContainer.remove(); }
    }
    
    function checkAutoLogin() {
        var savedUser = localStorage.getItem('current_user');
        if (savedUser) {
            var users = loadUsers();
            if (users[savedUser]) { login(savedUser, users[savedUser].password); return true; }
        }
        return false;
    }
    
    function exportToExcel(id) {
        var memo = memos[id];
        var fileName = currentUser.id + '_' + getTodayString();
        var data = [[...memo.headers, '完成状态'], ...memo.rows.map(function(row) { return [...row.cells, row.completed ? '已完成' : '未完成']; }), [''], ['备注信息'], [''], ...(stripHtml(memo.remark || '').split('\n').filter(function(l) { return l.trim(); }).map(function(l) { return [l]; })), [''], ['----------------------------------------'], ['导出时间：' + new Date().toLocaleString()], ['导出自：' + currentUser.id]];
        var xml = '<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="' + fileName.substring(0,31) + '"><Table>\n';
        data.forEach(function(row) {
            xml += '<Row>\n';
            row.forEach(function(cell) {
                xml += '<Cell><Data ss:Type="String">' + String(cell || '').replace(/[&<>]/g, function(m) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]; }) + '</Data></Cell>\n';
            });
            xml += '</Row>\n';
        });
        xml += '</Table></Worksheet></Workbook>';
        var blob = new Blob([xml], { type: 'application/vnd.ms-excel' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName + '.xls';
        link.click();
        URL.revokeObjectURL(link.href);
        alert('Excel导出成功！');
    }
    
    function triggerImport(memoId) { document.getElementById('importFile-' + memoId).click(); }
    function handleImportFile(event, targetMemoId) {
        var file = event.target.files[0];
        if (!file) return;
        var baseName = file.name.replace(/\.[^/.]+$/, '').substring(0, 30);
        var reader = new FileReader();
        reader.onload = function(e) {
            var newId = 'memo_' + nextId++;
            memos[newId] = { id: newId, name: baseName, headers: ['导入的任务', '状态'], rows: [{ cells: ['导入的数据', '新'], completed: false, bgColor: '#ffffff' }], remark: '' };
            currentMemoId = newId;
            saveToLocal();
            render();
            alert('导入成功！已创建新备忘录：' + baseName);
        };
        reader.readAsText(file, 'UTF-8');
        event.target.value = '';
    }
    
    function saveTemplate(id) {
        var memo = memos[id];
        var name = prompt('请输入模板名称:', memo.name + '_模板');
        if (name) {
            var template = { name: name, headers: memo.headers.slice(), rows: memo.rows.map(function(row) { return { cells: row.cells.slice(), completed: row.completed, bgColor: row.bgColor }; }), remark: memo.remark };
            var templates = JSON.parse(localStorage.getItem('user_' + currentUser.id + '_templates') || '[]');
            templates.push(template);
            localStorage.setItem('user_' + currentUser.id + '_templates', JSON.stringify(templates));
            alert('模板保存成功！');
        }
    }
    
    function loadTemplate(id) {
        var templates = JSON.parse(localStorage.getItem('user_' + currentUser.id + '_templates') || '[]');
        if (templates.length === 0) { alert('暂无保存的模板'); return; }
        var msg = '选择模板:\n';
        templates.forEach(function(t, i) { msg += (i+1) + '. ' + t.name + '\n'; });
        var idx = parseInt(prompt(msg)) - 1;
        if (idx >= 0 && idx < templates.length) {
            var t = templates[idx];
            memos[id].headers = t.headers.slice();
            memos[id].rows = t.rows.map(function(row) { return { cells: row.cells.slice(), completed: row.completed, bgColor: row.bgColor || '#ffffff' }; });
            memos[id].remark = t.remark;
            saveToLocal();
            render();
            alert('模板加载成功！');
        }
    }
