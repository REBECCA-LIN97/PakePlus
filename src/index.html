<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能备忘录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Microsoft YaHei', sans-serif; }
        body { background: var(--bg-primary); padding: 20px; transition: all 0.3s; }
        .theme-1 { --bg-primary: #F3F0E9; --bg-secondary: #E8E4DB; --accent-primary: #9CAF88; --accent-hover: #8A9D73; --text-dark: #4A4A4A; --border-color: #D1CCC4; --card-white: #FCFAF5; }
        .theme-2 { --bg-primary: #E8EDF2; --bg-secondary: #DCE3E9; --accent-primary: #7D8C7F; --accent-hover: #6B7A6D; --text-dark: #4A5A6A; --border-color: #C8D0D8; --card-white: #F5F7FA; }
        .theme-3 { --bg-primary: #E8EFE5; --bg-secondary: #DCE6D3; --accent-primary: #8BA384; --accent-hover: #799172; --text-dark: #3A5A3A; --border-color: #C8D8C0; --card-white: #F4F8F0; }
        .theme-4 { --bg-primary: #F5EDEF; --bg-secondary: #EDE1E4; --accent-primary: #C9A9B4; --accent-hover: #B897A2; --text-dark: #5A4A4A; --border-color: #D8C8CC; --card-white: #FDF7F8; }
        .theme-5 { --bg-primary: #EBE4E8; --bg-secondary: #DFD5DC; --accent-primary: #B5A0B0; --accent-hover: #A38E9E; --text-dark: #4A3A4A; --border-color: #C8BCC4; --card-white: #F9F5F8; }
        .theme-6 { --bg-primary: #E5E8E3; --bg-secondary: #D9DDD4; --accent-primary: #A0B0A0; --accent-hover: #8E9E8E; --text-dark: #3A4A3A; --border-color: #C0C8BC; --card-white: #F4F6F0; }
        .theme-7 { --bg-primary: #F0EAE3; --bg-secondary: #E4DCD3; --accent-primary: #C4A882; --accent-hover: #B29670; --text-dark: #5A4A3A; --border-color: #D4C8BC; --card-white: #FCF8F2; }
        .theme-8 { --bg-primary: #E3E6EE; --bg-secondary: #D7DAE4; --accent-primary: #8E9EBB; --accent-hover: #7C8CA9; --text-dark: #3A4A5A; --border-color: #BCC4D0; --card-white: #F0F2F8; }
        .theme-9 { --bg-primary: #EDE5DF; --bg-secondary: #E1D7CF; --accent-primary: #B89A8A; --accent-hover: #A68878; --text-dark: #5A4A3A; --border-color: #D0C4BC; --card-white: #FBF6F2; }
        .theme-10 { --bg-primary: #E2E6E0; --bg-secondary: #D4D9D0; --accent-primary: #90A89A; --accent-hover: #7E9688; --text-dark: #3A4A3A; --border-color: #BCC4B8; --card-white: #F0F4EC; }
        
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 20000; display: flex; justify-content: center; align-items: center; }
        .login-container { background: var(--card-white); border-radius: 24px; padding: 32px; width: 400px; max-width: 90%; border: 1px solid var(--border-color); }
        .login-title { font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 24px; color: var(--text-dark); }
        .login-input { width: 100%; padding: 12px 16px; margin-bottom: 16px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 14px; background: var(--card-white); color: var(--text-dark); }
        .login-input:focus { outline: none; border-color: var(--accent-primary); }
        .login-btn { width: 100%; padding: 12px; background: var(--accent-primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 500; cursor: pointer; }
        .login-btn:hover { background: var(--accent-hover); }
        .login-link { text-align: center; margin-top: 16px; color: var(--text-light); cursor: pointer; }
        .login-link span { color: var(--accent-primary); text-decoration: underline; }
        
        .main-app { max-width: 1400px; margin: 0 auto; }
        .user-bar { display: flex; justify-content: flex-end; align-items: center; gap: 16px; margin-bottom: 16px; padding: 8px 16px; background: var(--bg-secondary); border-radius: 40px; }
        .user-name { color: var(--text-dark); font-weight: 500; }
        .action-btn { background: var(--accent-primary); color: white; border: none; padding: 8px 18px; border-radius: 40px; cursor: pointer; }
        .action-btn:hover { background: var(--accent-hover); }
        .zoom-control { display: inline-flex; align-items: center; gap: 8px; background: var(--bg-secondary); padding: 5px 12px; border-radius: 40px; margin-left: 10px; }
        .zoom-btn { background: var(--accent-primary); color: white; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 16px; }
        .zoom-value { font-size: 13px; min-width: 50px; text-align: center; color: var(--text-dark); }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .left-group { display: flex; align-items: center; gap: 10px; }
        
        .tabs-container { background: var(--card-white); border-radius: 16px 16px 0 0; padding: 12px 20px 0 20px; display: flex; gap: 8px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; background: var(--bg-secondary); border: none; border-radius: 12px 12px 0 0; cursor: pointer; font-weight: 500; color: var(--text-dark); }
        .tab.active { background: var(--accent-primary); color: white; }
        .tab-delete { background: none; border: none; cursor: pointer; font-size: 16px; padding: 0 5px; border-radius: 50%; margin-left: 8px; }
        .add-tab { background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        
        .main-content { background: var(--card-white); border-radius: 0 0 16px 16px; padding: 20px; }
        .memo-pane { display: none; }
        .memo-pane.active { display: block; }
        
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; padding: 10px; background: var(--bg-secondary); border-radius: 12px; align-items: center; }
        .memo-name { padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-white); color: var(--text-dark); }
        .icon-btn { background: var(--bg-secondary); border: none; cursor: pointer; font-size: 14px; padding: 5px 12px; border-radius: 6px; }
        .icon-btn:hover { background: var(--accent-primary); color: white; }
        
        .table-wrap { overflow-x: auto; margin: 16px 0; border-radius: 12px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { border: 1px solid var(--border-color); padding: 10px 12px; text-align: left; vertical-align: top; }
        th { background: var(--bg-secondary); font-weight: 600; color: var(--text-dark); }
        .col-select { width: 40px; text-align: center; }
        .col-status { text-align: center; width: 60px; }
        .col-action { text-align: center; width: 130px; }
        .row-completed { text-decoration: line-through; opacity: 0.6; }
        
        [contenteditable="true"] { outline: none; min-height: 24px; cursor: text; }
        [contenteditable="true"]:focus { background: rgba(156, 175, 136, 0.2); }
        
        .remark-box { margin-top: 20px; padding: 16px; background: var(--bg-secondary); border-radius: 12px; }
        .remark-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .remark-editor { width: 100%; min-height: 100px; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); font-size: 14px; resize: vertical; background: var(--card-white); }
        .small-btn { padding: 4px 12px; font-size: 12px; background: var(--accent-primary); color: white; border: none; border-radius: 6px; cursor: pointer; }
        
        .theme-box { margin-top: 16px; padding: 12px; background: var(--bg-secondary); border-radius: 12px; display: flex; align-items: center; gap: 12px; }
        .theme-circle { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover)); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        
        .drawer-panel { position: fixed; right: -300px; top: 0; width: 280px; height: 100%; background: var(--card-white); transition: right 0.3s; z-index: 10001; overflow-y: auto; border-left: 1px solid var(--border-color); }
        .drawer-panel.open { right: 0; }
        .drawer-header { padding: 20px; background: var(--accent-primary); color: white; display: flex; justify-content: space-between; align-items: center; }
        .drawer-close { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .drawer-list { padding: 16px; }
        .theme-option { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 8px; border-radius: 12px; cursor: pointer; background: var(--bg-secondary); }
        .theme-option.active { background: var(--accent-primary); color: white; }
        .theme-color { width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; }
        
        .color-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; }
        .color-content { background: white; border-radius: 16px; padding: 20px; max-width: 500px; width: 90%; }
        .color-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; }
        .color-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; margin-bottom: 20px; }
        .color-block { width: 100%; aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .color-block:hover { transform: scale(1.1); border-color: #333; }
        .custom-row { display: flex; gap: 10px; margin-top: 15px; align-items: center; }
        .custom-color { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
        .color-preview { width: 40px; height: 40px; border-radius: 6px; border: 1px solid #ddd; }
        .dialog-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 20001; justify-content: center; align-items: center; }
        .modal-content { background: var(--card-white); border-radius: 20px; width: 80%; max-width: 700px; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; }
        .modal-header { padding: 20px; background: var(--accent-primary); color: white; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
        .history-item { background: var(--bg-secondary); border-radius: 12px; padding: 15px; margin-bottom: 12px; cursor: pointer; border-left: 4px solid var(--accent-primary); }
        .list-item { background: var(--bg-secondary); border-radius: 12px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .detail-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .detail-table th, .detail-table td { border: 1px solid var(--border-color); padding: 8px; }
        .restore-btn { background: #28a745; color: white; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; margin-right: 8px; }
        .delete-perm { background: #dc3545; }
        .status-text { font-size: 12px; color: #28a745; margin-top: 8px; }
        .template-select { width: 100%; padding: 8px; margin-top: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-white); }
    </style>
</head>
<body class="theme-1">
<div id="root"></div>

<script>
(function(){
    var themes = [
        {id:1,name:'雾里看花',c1:'#F3F0E9',c2:'#9CAF88'},
        {id:2,name:'烟雨江南',c1:'#E8EDF2',c2:'#7D8C7F'},
        {id:3,name:'青山远黛',c1:'#E8EFE5',c2:'#8BA384'},
        {id:4,name:'落樱缤纷',c1:'#F5EDEF',c2:'#C9A9B4'},
        {id:5,name:'紫藤花语',c1:'#EBE4E8',c2:'#B5A0B0'},
        {id:6,name:'晨雾松林',c1:'#E5E8E3',c2:'#A0B0A0'},
        {id:7,name:'秋日私语',c1:'#F0EAE3',c2:'#C4A882'},
        {id:8,name:'月夜星空',c1:'#E3E6EE',c2:'#8E9EBB'},
        {id:9,name:'暖阳午后',c1:'#EDE5DF',c2:'#B89A8A'},
        {id:10,name:'清泉石上',c1:'#E2E6E0',c2:'#90A89A'}
    ];
    
    var colorList = ['#000000','#333333','#666666','#999999','#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#98D8C8','#F7B731','#FF9F4A','#A8E6CF','#FFD3B6','#FF8B94','#0066ff','#28a745','#dc3545','#fd7e14'];
    
    var currentUser = null;
    var memos = {};
    var currentMemoId = null;
    var nextId = 1;
    var historyList = [];
    var trashList = [];
    var templateList = [];
    var zoom = 100;
    var currentTheme = 1;
    var colorCallback = null;
    
    function escapeHtml(s){if(!s)return'';return String(s).replace(/[&<>]/g,function(m){return m==='&'?'&amp;':m==='<'?'&lt;':'&gt;';});}
    function stripHtml(h){if(!h)return'';var d=document.createElement('div');d.innerHTML=h;return d.innerText||'';}
    function getToday(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
    
    function applyZoom(){var el=document.getElementById('mainApp');if(el){el.style.transform='scale('+(zoom/100)+')';el.style.transformOrigin='top left';}var zv=document.getElementById('zoomValue');if(zv)zv.innerText=zoom+'%';localStorage.setItem('zoom',zoom);}
    function zoomIn(){if(zoom+10<=150){zoom+=10;applyZoom();}}
    function zoomOut(){if(zoom-10>=50){zoom-=10;applyZoom();}}
    function zoomReset(){zoom=100;applyZoom();}
    
    function changeTheme(id){currentTheme=id;document.body.className='theme-'+id;if(currentUser)localStorage.setItem('user_'+currentUser.id+'_theme',id);var opts=document.querySelectorAll('.theme-option');for(var i=0;i<opts.length;i++){if(parseInt(opts[i].dataset.id)===id)opts[i].classList.add('active');else opts[i].classList.remove('active');}closeDrawer();}
    function openDrawer(){var p=document.getElementById('drawerPanel');if(p)p.classList.add('open');}
    function closeDrawer(){var p=document.getElementById('drawerPanel');if(p)p.classList.remove('open');}
    
    function loadUsers(){return JSON.parse(localStorage.getItem('memo_users')||'{}');}
    function saveUsers(u){localStorage.setItem('memo_users',JSON.stringify(u));}
    
    function register(id,pw,q,a){
        var u=loadUsers();
        if(u[id]){alert('ID已存在');return false;}
        u[id]={pwd:pw,question:q,answer:a};
        saveUsers(u);
        return true;
    }
    
    function login(id,pw){
        var u=loadUsers();
        if(!u[id]){alert('账号不存在');return false;}
        if(u[id].pwd!==pw){alert('密码错误');return false;}
        currentUser={id:id};
        localStorage.setItem('cur_user',id);
        
        var sd=localStorage.getItem('user_'+id+'_data');
        if(sd){memos=JSON.parse(sd);}else{var dm=defaultMemo();memos={};memos[dm.id]=dm;}
        
        var max=0;for(var k in memos){var n=parseInt(k.split('_')[1])||0;if(n>max)max=n;}nextId=max+1;
        var keys=Object.keys(memos);currentMemoId=keys.length>0?keys[0]:null;
        
        var st=localStorage.getItem('user_'+id+'_theme');if(st)changeTheme(parseInt(st));else changeTheme(1);
        var h=localStorage.getItem('user_'+id+'_history');if(h)historyList=JSON.parse(h);else historyList=[];
        var t=localStorage.getItem('user_'+id+'_trash');if(t)trashList=JSON.parse(t);else trashList=[];
        var tp=localStorage.getItem('user_'+id+'_templates');if(tp)templateList=JSON.parse(tp);else templateList=[];
        
        renderMainApp();
        return true;
    }
    
    function logout(){
        currentUser=null;
        localStorage.removeItem('cur_user');
        showLoginPage();
    }
    
    function saveAll(){
        if(currentUser){
            localStorage.setItem('user_'+currentUser.id+'_data',JSON.stringify(memos));
            localStorage.setItem('user_'+currentUser.id+'_history',JSON.stringify(historyList));
            localStorage.setItem('user_'+currentUser.id+'_trash',JSON.stringify(trashList));
            localStorage.setItem('user_'+currentUser.id+'_templates',JSON.stringify(templateList));
        }
    }
    
    function defaultMemo(){
        return{
            id:'memo_1',
            name:'我的备忘录',
            headers:['任务名称','优先级','截止日期'],
            rows:[
                {cells:['撰写周报','高',getToday()],completed:false,bgColor:'#fff'},
                {cells:['整理文档','中',getToday()],completed:false,bgColor:'#fff'},
                {cells:['团队会议','高',getToday()],completed:false,bgColor:'#fff'}
            ],
            remark:''
        };
    }
    
    // ========== 模板功能 ==========
    function saveCurrentAsTemplate(){
        var m=memos[currentMemoId];
        if(!m)return;
        var name=prompt('请输入模板名称:',m.name+'_模板');
        if(name && name.trim()){
            var template={
                id:Date.now(),
                name:name.trim(),
                headers:m.headers.slice(),
                rows:m.rows.map(function(row){
                    return{
                        cells:row.cells.slice(),
                        completed:row.completed,
                        bgColor:row.bgColor
                    };
                }),
                remark:m.remark
            };
            templateList.push(template);
            saveAll();
            alert('模板保存成功！');
        }
    }
    
    function loadTemplate(){
        if(templateList.length===0){
            alert('暂无保存的模板');
            return;
        }
        var msg='选择要加载的模板:\n\n';
        for(var i=0;i<templateList.length;i++){
            msg+=(i+1)+'. '+templateList[i].name+'\n';
        }
        var idx=parseInt(prompt(msg))-1;
        if(idx>=0 && idx<templateList.length){
            var t=templateList[idx];
            var m=memos[currentMemoId];
            m.headers=t.headers.slice();
            m.rows=[];
            for(var i=0;i<t.rows.length;i++){
                m.rows.push({
                    cells:t.rows[i].cells.slice(),
                    completed:t.rows[i].completed,
                    bgColor:t.rows[i].bgColor||'#fff'
                });
            }
            m.remark=t.remark;
            saveAll();
            renderMemos();
            alert('模板加载成功！');
        }
    }
    
    // ========== 表格操作 ==========
    function addRow(mid){var m=memos[mid];if(!m)return;m.rows.push({cells:new Array(m.headers.length).fill('新任务'),completed:false,bgColor:'#fff'});saveAll();renderMemos();}
    
    function delRow(mid,rid){
        if(confirm('确定删除这一行吗？')){memos[mid].rows.splice(rid,1);saveAll();renderMemos();}
    }
    
    function addCol(mid){var m=memos[mid];if(!m)return;m.headers.push('新列'+(m.headers.length+1));for(var i=0;i<m.rows.length;i++){m.rows[i].cells.push('新内容');}saveAll();renderMemos();}
    
    function delCol(mid,cid){
        var m=memos[mid];
        if(!m)return;
        if(confirm('确定删除这一列吗？')){
            if(m.headers.length<=1){alert('至少保留一列');return;}
            m.headers.splice(cid,1);
            for(var i=0;i<m.rows.length;i++){m.rows[i].cells.splice(cid,1);}
            saveAll();
            renderMemos();
        }
    }
    
    function updateCell(mid,rid,cid,val){var m=memos[mid];if(m&&m.rows[rid]){m.rows[rid].cells[cid]=val;saveAll();}}
    function updateHeader(mid,cid,val){var m=memos[mid];if(m){m.headers[cid]=val;saveAll();}}
    function toggleComplete(mid,rid,chk){var m=memos[mid];if(m&&m.rows[rid]){m.rows[rid].completed=chk;saveAll();renderMemos();}}
    function showRowColor(mid,rid){var m=memos[mid];if(!m||!m.rows[rid])return;showColorPicker('选择行背景色',m.rows[rid].bgColor||'#fff',function(c){m.rows[rid].bgColor=c;saveAll();renderMemos();});}
    
    function selectAll(mid,chk){
        var m=memos[mid];if(!m)return;
        for(var i=0;i<m.rows.length;i++)m.rows[i].completed=chk;
        saveAll();
        if(chk){
            var hi={id:Date.now(),name:m.name,data:JSON.parse(JSON.stringify(m)),date:new Date().toLocaleString()};
            historyList.push(hi);saveAll();
            var nid='memo_'+nextId++;
            memos[nid]={id:nid,name:'备忘录'+(nextId-1),headers:m.headers.slice(),rows:[{cells:new Array(m.headers.length).fill('新任务'),completed:false,bgColor:'#fff'}],remark:''};
            delete memos[mid];currentMemoId=nid;renderMainApp();
            alert('所有任务已完成，已移至历史记录！');
        }else{renderMemos();}
    }
    
    // 备注栏
    function getRemarkEditor(){var p=document.querySelector('.memo-pane.active');if(p){var id=p.dataset.id;var ed=document.getElementById('remark-'+id);return{ed:ed,id:id};}return{ed:null,id:null};}
    function formatCmd(cmd){var o=getRemarkEditor();if(o.ed){document.execCommand(cmd,false,null);saveRemark();}}
    function formatColorText(){var o=getRemarkEditor();if(!o.ed){alert('请先点击备注栏');return;}o.ed.focus();var sel=window.getSelection();if(!sel||sel.isCollapsed){alert('请先选中文字');return;}showColorPicker('选择文字颜色','#000000',function(c){o.ed.focus();document.execCommand('foreColor',false,c);saveRemark();});}
    function saveRemark(){var o=getRemarkEditor();if(o.ed&&memos[o.id]){memos[o.id].remark=o.ed.innerHTML;saveAll();}}
    
    // 历史记录
    function showHistory(){
        if(historyList.length===0){alert('暂无历史记录');return;}
        var body=document.getElementById('modalBody');var title=document.getElementById('modalTitle');
        if(!body||!title)return;
        title.innerText='历史记录';
        var html='';
        for(var i=0;i<historyList.length;i++){
            var h=historyList[i];
            html+='<div class="history-item" onclick="viewHistory(\''+h.id+'\')"><div class="history-item-title">📋 '+escapeHtml(h.name)+'</div><div class="history-item-date">完成时间：'+h.date+'</div></div>';
        }
        body.innerHTML=html;
        document.getElementById('modalOverlay').style.display='flex';

        for(var r=0;r<data.length;r++){xml+='<Row>\n';for(var c=0;c<data[r].length;c++){var cv=String(data[r][c]||'');xml+='<Cell><Data ss:Type="String">'+cv.replace(/[&<>]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[m];})+'</Data></Cell>\n';}xml+='</Row>\n';}

        var link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=fileName+'.xls';link.click();URL.revokeObjectURL(link.href);

    function importExcel(file){
        if(!file)return;
        var reader=new FileReader();
        reader.onload=function(e){
            var content=e.target.result;
            var rows=[];
            var isXml=content.trim().startsWith('<?xml');
            if(isXml){
                var parser=new DOMParser();
                var xmlDoc=parser.parseFromString(content,'text/xml');
                var rowNodes=xmlDoc.getElementsByTagName('Row');
                for(var i=0;i<rowNodes.length;i++){
                    var cells=rowNodes[i].getElementsByTagName('Cell');
                    var rowData=[];
                    for(var j=0;j<cells.length;j++){
                        var dataNode=cells[j].getElementsByTagName('Data')[0];
                        rowData.push(dataNode?dataNode.textContent||'':'');
                    }
                    if(rowData.length>0 && rowData.some(function(c){return c && c.trim()!=='';}))rows.push(rowData);
                }
            }else{
                var lines=content.split(/\r?\n/);
                for(var i=0;i<lines.length;i++){
                    var line=lines[i].trim();
                    if(line==='')continue;
                    var row=[],inQuote=false,cell='';
                    for(var j=0;j<line.length;j++){
                        var ch=line[j];
                        if(ch==='"'){inQuote=!inQuote;}
                        else if(ch===',' && !inQuote){row.push(cell);cell='';}
                        else{cell+=ch;}
                    }
                    row.push(cell);
                    var cleanRow=row.map(function(c){if(c.startsWith('"')&&c.endsWith('"'))return c.slice(1,-1);return c;});
                    if(cleanRow.length>0 && cleanRow.some(function(c){return c && c.trim()!=='';}))rows.push(cleanRow);
                }
            }
            if(rows.length<2){alert('无法解析文件');return;}
            var headerRowIndex=0;
            for(var i=0;i<Math.min(5,rows.length);i++){
                var firstCell=rows[i][0]||'';
                if(firstCell && !firstCell.includes('备注信息') && !firstCell.includes('导出时间') && !firstCell.includes('-----')){headerRowIndex=i;break;}
            }
            var headers=rows[headerRowIndex]?rows[headerRowIndex].slice():['任务','状态'];
            if(headers[headers.length-1]==='完成状态')headers.pop();
            var remarkStartIndex=-1;
            for(var i=0;i<rows.length;i++){
                var firstCell=rows[i][0]||'';
                if(firstCell.includes('备注信息') || firstCell.includes('【备注信息】')){remarkStartIndex=i;break;}
            }
            var dataRows=[];
            var startRow=headerRowIndex+1;
            var endRow=remarkStartIndex>0?remarkStartIndex:rows.length;
            for(var i=startRow;i<endRow;i++){
                if(!rows[i] || rows[i].length===0)continue;
                if(rows[i].length===1 && rows[i][0].trim()==='')continue;
                var rowCells=[];
                for(var j=0;j<headers.length;j++){rowCells.push(rows[i][j]||'');}
                var statusCell=rows[i][headers.length]||'';
                var completed=(statusCell.includes('已完成')||statusCell.includes('✓'));
                if(rowCells.some(function(c){return c && c.trim()!=='';})){dataRows.push({cells:rowCells,completed:completed,bgColor:'#fff'});}
            }
            var remarkText='';
            if(remarkStartIndex>0){
                for(var i=remarkStartIndex+1;i<rows.length;i++){
                    if(rows[i] && rows[i][0]){
                        var line=rows[i][0].trim();
                        if(line && !line.includes('导出时间') && !line.includes('-----') && !line.includes('导出自')){remarkText+=line+'<br>';}
                    }
                }
            }
            if(dataRows.length===0){dataRows.push({cells:new Array(headers.length).fill(''),completed:false,bgColor:'#fff'});}
            var baseName=file.name.replace(/\.[^/.]+$/,'').substring(0,30)||'导入的备忘录';
            var nid='memo_'+nextId++;
            memos[nid]={id:nid,name:baseName,headers:headers,rows:dataRows,remark:remarkText||''};
            currentMemoId=nid;saveAll();renderMainApp();
            alert('导入成功！\n备忘录名称：'+baseName+'\n共导入 '+dataRows.length+' 行数据');
        };
        reader.readAsText(file,'UTF-8');
    }

        document.getElementById('nextBtn').onclick=function(){var id=document.getElementById('forId').value;if(!id){alert('请输入ID');return;}var u=loadUsers();if(!u[id]){alert('账号不存在');return;}c.innerHTML='<div class="login-title">验证密保</div><div style="padding:12px;background:var(--bg-secondary);border-radius:8px;margin-bottom:16px;">密保问题：'+u[id].question+'</div><input type="text" id="ans" class="login-input" placeholder="密保答案"><input type="password" id="newPw" class="login-input" placeholder="新密码"><button class="login-btn" id="resetBtn">重置密码</button><div class="login-link" id="backLoginBtn3"><span>返回登录</span></div>';
            document.getElementById('resetBtn').onclick=function(){var ans=document.getElementById('ans').value;var npw=document.getElementById('newPw').value;if(!ans||!npw){alert('请填写完整');return;}if(u[id].answer===ans){u[id].pwd=npw;saveUsers(u);alert('重置成功！请登录');showLoginPage();}else{alert('密保答案错误');}};
            document.getElementById('backLoginBtn3').onclick=showLoginPage;
        };
        document.getElementById('backLoginBtn2').onclick=showLoginPage;
    }
    
    // 暴露全局函数
    window.logout=logout;window.closeModal=closeModal;
    window.showHistory=showHistory;window.viewHistory=viewHistory;window.restoreHistory=restoreHistory;
    window.showTrash=showTrash;window.restoreMemo=restoreMemo;window.deleteMemoPerm=deleteMemoPerm;
    window.closeColorPicker=closeColorPicker;window.confirmColorPick=confirmColorPick;
    window.openDrawer=openDrawer;window.closeDrawer=closeDrawer;
    window.addRow=addRow;window.delRow=delRow;window.addCol=addCol;window.delCol=delCol;
    window.updateCell=updateCell;window.updateHeader=updateHeader;window.toggleComplete=toggleComplete;
    window.showRowColor=showRowColor;window.selectAll=selectAll;
    window.formatCmd=formatCmd;window.formatColorText=formatColorText;window.saveRemark=saveRemark;
    window.exportToExcel=exportToExcel;window.importExcel=importExcel;
    window.saveCurrentAsTemplate=saveCurrentAsTemplate;window.loadTemplate=loadTemplate;
    
    var savedUser=localStorage.getItem('cur_user');
    if(savedUser){var u=loadUsers();if(u[savedUser]){login(savedUser,u[savedUser].pwd);}else{showLoginPage();}}else{showLoginPage();}
})();
